<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>repo-map — Obsidian de codebase</title>
<style>
  :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --accent:#58a6ff; --panel:#161b22; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font:14px/1.4 -apple-system,Segoe UI,Roboto,sans-serif; overflow:hidden; }
  #graph { position:absolute; inset:0; }
  #hud { position:absolute; top:16px; left:18px; z-index:10; pointer-events:none; }
  #hud h1 { margin:0; font-size:15px; font-weight:600; letter-spacing:.3px; }
  #hud .sub { color:var(--muted); font-size:12px; margin-top:2px; }
  #hud .target { color:var(--accent); font-size:11px; margin-top:6px; max-width:46vw;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #legend { position:absolute; bottom:14px; left:18px; z-index:10; font-size:11px;
    color:var(--muted); max-width:60vw; }
  #legend .row { display:inline-flex; align-items:center; margin:2px 10px 2px 0; }
  #legend .dot { width:9px; height:9px; border-radius:50%; margin-right:5px; }
  #tip { position:absolute; z-index:20; pointer-events:none; background:#161b22ee;
    border:1px solid #30363d; border-radius:6px; padding:6px 9px; font-size:12px;
    color:var(--fg); display:none; max-width:300px; }
  #hint { position:absolute; top:16px; right:18px; z-index:10; color:var(--muted);
    font-size:11px; text-align:right; pointer-events:none; }
  /* panneau outline */
  #panel { position:absolute; top:0; right:0; width:340px; height:100%; z-index:30;
    background:#161b22f2; border-left:1px solid #30363d; backdrop-filter:blur(3px);
    transform:translateX(100%); transition:transform .22s ease; display:flex;
    flex-direction:column; }
  #panel.open { transform:none; }
  #panel header { padding:14px 16px 10px; border-bottom:1px solid #30363d; }
  #panel header .name { font-size:14px; font-weight:600; word-break:break-all; }
  #panel header .meta { color:var(--muted); font-size:11px; margin-top:3px; }
  #panel .close { position:absolute; top:10px; right:12px; cursor:pointer;
    color:var(--muted); font-size:18px; line-height:1; }
  #panel .close:hover { color:var(--fg); }
  #list { overflow-y:auto; padding:6px 0; }
  .sym { padding:7px 16px; border-bottom:1px solid #21262d; cursor:pointer; }
  .sym:hover { background:#1f2630; }
  .sym .sig { font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:12px;
    color:#e6edf3; word-break:break-word; }
  .sym .loc { color:var(--muted); font-size:10.5px; margin-top:2px; }
  .sym .kind { display:inline-block; font-size:9px; text-transform:uppercase;
    letter-spacing:.4px; padding:1px 5px; border-radius:3px; margin-right:6px;
    vertical-align:middle; }
  .k-class { background:#3b2e58; color:#d2a8ff; }
  .k-function { background:#16352a; color:#7ee787; }
  .k-variable { background:#3a2d12; color:#ffa657; }
</style>
</head>
<body>
<div id="graph"></div>
<div id="hud">
  <h1>🧠 repo-map — Obsidian de codebase</h1>
  <div class="sub" id="stats">chargement…</div>
  <div class="target" id="target"></div>
</div>
<div id="hint">taille = importance (PageRank) · couleur = module · flèche = appel<br>clic sur un fichier = déplier + voir son contenu</div>
<div id="legend"></div>
<div id="tip"></div>
<div id="panel">
  <span class="close" id="panelClose">×</span>
  <header><div class="name" id="panelName"></div><div class="meta" id="panelMeta"></div></header>
  <div id="list"></div>
</div>

<script src="https://unpkg.com/d3-force@3"></script>
<script src="https://unpkg.com/force-graph@1.43.0/dist/force-graph.min.js"></script>
<script>
const PALETTE = ['#58a6ff','#7ee787','#ff7b72','#d2a8ff','#ffa657','#79c0ff',
  '#f778ba','#56d4dd','#e3b341','#a5d6ff','#ff9bce','#b0e057'];

fetch('/graph.json').then(r => r.json()).then(data => {
  const modules = [...new Set(data.nodes.map(n => n.module))].sort();
  const colorOf = m => PALETTE[modules.indexOf(m) % PALETTE.length];
  const maxRank = Math.max(1e-9, ...data.nodes.map(n => n.rank));
  const maxSym = Math.max(1e-9, ...data.nodes.flatMap(n => n.symbols.map(s => s.rank)));
  const radius = n => n.kind === 'sym'
    ? 2 + 8 * Math.sqrt(n.rank / maxSym)
    : 3 + 22 * Math.sqrt(n.rank / maxRank);

  document.getElementById('stats').textContent =
    `${data.nodes.length} fichiers · ${data.links.length} liens d'appel`;
  document.getElementById('target').textContent = data.target;

  const leg = document.getElementById('legend');
  modules.slice(0, 12).forEach(m => {
    const row = document.createElement('span'); row.className = 'row';
    row.innerHTML = `<span class="dot" style="background:${colorOf(m)}"></span>${m}`;
    leg.appendChild(row);
  });

  // --- dépliage fichier -> symboles --------------------------------------
  const expanded = new Map();   // fileId -> {symNodes, symLinks}
  const composed = () => {
    const nodes = [...data.nodes], links = [...data.links];
    for (const e of expanded.values()) { nodes.push(...e.symNodes); links.push(...e.symLinks); }
    return { nodes, links };
  };
  function toggle(file) {
    if (expanded.has(file.id)) {
      expanded.delete(file.id);
      Graph.graphData(composed());
      setTimeout(() => Graph.zoomToFit(600, 80), 60);   // repli -> on recadre tout le graphe
    } else {
      const symNodes = file.symbols.map(s => ({
        id: file.id + '::' + s.name, kind: 'sym', label: s.name, module: file.module,
        rank: s.rank, sig: s.signature, symKind: s.kind, line: s.line, end_line: s.end_line,
        x: (file.x || 0) + (Math.random() - .5) * 28,
        y: (file.y || 0) + (Math.random() - .5) * 28,
      }));
      const symLinks = symNodes.map(sn => ({ source: file.id, target: sn.id, member: true }));
      expanded.set(file.id, { symNodes, symLinks });
      Graph.graphData(composed());
    }
  }

  // centrage compensé par le panneau de droite (340px) : on décale la cible vers la droite
  // pour que le nœud apparaisse au centre de la zone VISIBLE (à gauche du panneau).
  const PANEL_W = 340;
  function centerOn(node, z) {
    z = z || Graph.zoom();
    Graph.centerAt(node.x + (PANEL_W / 2) / z, node.y, 600);
    Graph.zoom(z, 600);
  }

  // --- panneau outline ----------------------------------------------------
  const panel = document.getElementById('panel');
  function openPanel(file) {
    document.getElementById('panelName').textContent = file.label;
    document.getElementById('panelMeta').textContent =
      `${file.ndefs} définitions · ${file.module} · importance ${file.rank.toFixed(4)}`;
    const list = document.getElementById('list');
    list.innerHTML = '';
    file.symbols.forEach(s => {
      const div = document.createElement('div'); div.className = 'sym';
      div.innerHTML = `<div class="sig"><span class="kind k-${s.kind}">${s.kind}</span>${s.signature}</div>`
        + `<div class="loc">L${s.line}–${s.end_line} · importance ${s.rank.toFixed(4)}</div>`;
      div.onclick = () => {
        const sn = (expanded.get(file.id) || {}).symNodes?.find(n => n.label === s.name);
        if (sn) { Graph.centerAt(sn.x, sn.y, 500); Graph.zoom(3, 500); }
      };
      list.appendChild(div);
    });
    panel.classList.add('open');
  }
  document.getElementById('panelClose').onclick = () => panel.classList.remove('open');

  // --- le graphe ----------------------------------------------------------
  const tip = document.getElementById('tip');
  const Graph = ForceGraph()(document.getElementById('graph'))
    .backgroundColor('#0d1117')
    .graphData(composed())
    .nodeId('id')
    .linkColor(l => l.member ? 'rgba(139,148,158,0.10)' : 'rgba(139,148,158,0.18)')
    .linkWidth(l => l.member ? 0.4 : Math.min(4, 0.4 + Math.sqrt(l.count)))
    .linkDirectionalArrowLength(l => l.member ? 0 : Math.min(6, 2 + l.count * 0.3))
    .linkDirectionalArrowRelPos(0.92)
    .linkDirectionalParticles(l => (!l.member && l.count > 3) ? 2 : 0)
    .linkDirectionalParticleWidth(1.6)
    .onNodeHover(n => {
      if (!n) { tip.style.display = 'none'; return; }
      tip.style.display = 'block';
      tip.innerHTML = n.kind === 'sym'
        ? `<b>${n.label}</b> <span style="color:#8b949e">${n.symKind}</span><br>`
          + `<span style="font-family:monospace;font-size:11px">${n.sig}</span>`
        : `<b>${n.label}</b><br>${n.ndefs} définitions · importance ${n.rank.toFixed(4)}`
          + `<br><span style="color:#8b949e">${n.module} · clic = déplier</span>`;
    })
    .onNodeClick(n => {
      if (n.kind === 'sym') { centerOn(n, Math.max(Graph.zoom(), 2.6)); return; }
      const willExpand = !expanded.has(n.id);
      openPanel(n);
      toggle(n);
      if (willExpand) centerOn(n, Graph.zoom());   // centre sur le fichier (sans zoom brutal)
    })
    .nodeCanvasObject((n, ctx, scale) => {
      const r = radius(n), col = colorOf(n.module), isSym = n.kind === 'sym';
      ctx.shadowColor = col;
      ctx.shadowBlur = isSym ? 6 : 14 * Math.sqrt(n.rank / maxRank);
      ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, 2 * Math.PI);
      ctx.fillStyle = isSym ? col + 'cc' : col; ctx.fill();
      if (isSym) { ctx.lineWidth = 0.4; ctx.strokeStyle = '#0d1117'; ctx.stroke(); }
      ctx.shadowBlur = 0;
      const big = isSym ? (n.rank / maxSym > 0.4) : (n.rank / maxRank > 0.25);
      if (big || scale > (isSym ? 2.2 : 1.6)) {
        ctx.font = `${Math.max(3, (isSym ? 9 : 11) / scale)}px -apple-system,Segoe UI,sans-serif`;
        ctx.fillStyle = isSym ? '#c9d1d9' : '#e6edf3';
        ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        ctx.fillText(n.label, n.x, n.y + r + 1.2);
      }
    })
    .nodePointerAreaPaint((n, color, ctx) => {
      ctx.beginPath(); ctx.arc(n.x, n.y, radius(n) + 2, 0, 2 * Math.PI);
      ctx.fillStyle = color; ctx.fill();
    });

  // espacement SANS collide (d3.forceCollide a besoin de d3.quadtree, non exposé par le
  // bundle d3-force seul -> crash). On écarte via répulsion BORNÉE (distanceMax, sinon le
  // graphe explose et zoomToFit dézoome à fond = écran vide) + liens assez longs.
  Graph.d3Force('charge').strength(-220).distanceMax(400);
  Graph.d3Force('link').distance(l => l.member ? 22 : 75).strength(l => l.member ? 0.9 : 0.25);
  Graph.d3VelocityDecay(0.45);          // amortit vite
  Graph.cooldownTime(7000);
  // quand le moteur s'arrête (layout posé), on FIGE tout -> plus de tremblement.
  // Un dépliage rajoute des nœuds non figés -> le moteur repart, se pose, re-fige.
  Graph.onEngineStop(() => {
    Graph.graphData().nodes.forEach(n => { n.fx = n.x; n.fy = n.y; });
  });

  addEventListener('mousemove', e => {
    tip.style.left = (e.clientX + 14) + 'px'; tip.style.top = (e.clientY + 14) + 'px'; });
  addEventListener('resize', () => Graph.width(innerWidth).height(innerHeight));
  setTimeout(() => Graph.zoomToFit(600, 70), 500);
});
</script>
</body>
</html>
